name: Deploy portfolio to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full SHA of the reviewed main commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: npm run check:source
      # Bind the owner's dispatch to the same checkout that produces the Pages artifact.
      - run: npm run check:release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_sha }}
      - uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6
      - run: npm run check:dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
